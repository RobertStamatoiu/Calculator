<!doctype html>
<html lang="en">
<head>
 	<meta charset="UTF-8">
 	<title>My Project</title>
  	<link rel="stylesheet" href="src/style.css">
</head>
<body>
	<div class="container">
		<div class="main">
			<div class="screen">
				<div class="previous-answer"></div>
				<div class="current-expression">0</div>
			</div>
			<div class="keypad">
				<!-- Row 0 -->
				<div class="function-key" id="pow">pow</div>
				<div class="function-key" id="e^">exp</div>
				<div class="function-key" id="CE">C</div>
				<div class="function-key" id="Delete">⌫</div>

				<!-- Row 1 -->
				<div class="function-key" id="square">x²</div>
				<div class="function-key" id="inverse">⅟&#8339;</div>
				<div class="function-key" id="root">&Sqrt;x</div>
				<div class="function-key" id="*">&times;</div>

				<!-- Row 2 -->
				<div class="number-key" id="7">7</div>
				<div class="number-key" id="8">8</div>
				<div class="number-key" id="9">9</div>
				<div class="function-key" id="/">&divide;</div>

				<!-- Row 3 -->
				<div class="number-key" id="4">4</div>
				<div class="number-key" id="5">5</div>
				<div class="number-key" id="6">6</div>
				<div class="function-key" id="-">&minus;</div>

				<!-- Row 4 -->
				<div class="number-key" id="1">1</div>
				<div class="number-key" id="2">2</div>
				<div class="number-key" id="3">3</div>
				<div class="function-key" id="+">&plus;</div>

				<!-- Row 5-->
				<div class="number-key" id="+/-">&plus;/&minus;</div>
				<div class="number-key" id="0">0</div>
				<div class="number-key" id=".">.</div>
				<div class="function-key" id="equals">&equals;</div>
			</div>
		</div>
	</div>
 	<script src="src/script.js"></script>
</body>
</html>
